<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxelCraft</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#111;
  color:white;
}

#menu {
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(#1a1a1a,#000);
}

h1 {
  font-size:40px;
}

button {
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:10px;
  margin-top:20px;
  background:#4CAF50;
  color:white;
}

#game {
  display:none;
}

canvas {
  width:100%;
  height:100%;
}
</style>
</head>

<body>

<div id="menu">
  <h1>VoxelCraft</h1>
  <button onclick="start()">Jugar</button>
</div>

<div id="game">
  <canvas id="c"></canvas>
</div>

<script>
function start(){
  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";
  alert("🔥 Próxima versión: mundo completo + controles");
}
</script>

</body>
</html>
